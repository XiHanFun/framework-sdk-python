name: 发布

# 推送 v* 标签（如 v0.1.0-rc.1、v0.1.0）触发，guard 通过后发布到 PyPI。
# GitHub Release 与 XiHan.Framework 一样，在标签推送之后手动建（version-release 技能）。
#
# guard 跑 scripts/release-check.sh，与打标签之前在本地跑的是同一份（version-release 技能）：
# 标签只从 main 发，标签号对应 src/xihan_framework/__init__.py 的 __version__，spec 子模块钉在规范标签上
# （预发布可钉 rc，正式版只钉正式版标签，RFC-0024）。不通过就不发布。
# 标签按语义化版本写，__version__ 按 PEP 440：v0.1.0-rc.1 对应 0.1.0rc1，只认 -alpha.N、-beta.N、-rc.N 三种预发布。
# 手动 Run workflow 时必须选中一个版本标签；选分支会被 guard 拦下。
#
# 认证走 PyPI 可信发布（OIDC），无长期令牌。
# pypi.org → 项目 xihan-framework → Manage → Publishing → Add a new publisher → GitHub：
# 所有者 XiHanFun、仓库 framework-sdk-python、工作流 release.yml、环境留空。
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    name: 发版核对
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 检出
        uses: actions/checkout@v5
        with:
          # 要拿完整历史才能判断祖先关系；子模块不检出，脚本读树里记的指针
          fetch-depth: 0

      - name: 只接受版本标签
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::error::发布只接受版本标签触发，收到 $GITHUB_REF_TYPE $GITHUB_REF_NAME"
            exit 1
          fi

      - name: 核对标签、版本与规范标签
        id: check
        run: bash scripts/release-check.sh "$GITHUB_REF_NAME" "$GITHUB_SHA"

  publish:
    name: 发布到 PyPI
    needs: guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # 颁发 GitHub OIDC 令牌，PyPI 用它换取这一次发布的短期令牌

    steps:
      - name: 检出（含规范 submodule）
        # 与 ci.yml 的打包检查同一检出方式：spec/ 在工作区里，分发包照样不带它
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: 安装 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: 构建 sdist 与 wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: 发布
        # 这个版本已在 PyPI 上（重跑）时跳过已有的文件
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
