[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "xihan-framework"
dynamic = ["version"]
description = "XiHan Framework SDK for Python: primitives, manifest, invocation context, pipeline, operations and the out-of-process plugin runtime."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "XiHanFun" }]
keywords = ["xihan", "framework", "plugin", "pipeline", "operations"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
# 进程外插件运行时 xihan_framework.plugin：gRPC 与 protobuf 只给它用，核心五块仍然零依赖。
# 生成的协议代码要求 protobuf 的大版本与生成它的 protoc 相同（7），grpcio 不低于生成它的 grpcio-tools
plugin = ["grpcio>=1.85.1", "protobuf>=7.36.2,<8"]

[project.urls]
Homepage = "https://framework.docs.xihanfun.com"
Documentation = "https://framework.docs.xihanfun.com"
Repository = "https://github.com/XiHanFun/framework-sdk-python"
Specification = "https://github.com/XiHanFun/framework-spec"
Issues = "https://github.com/XiHanFun/framework-sdk-python/issues"

[dependency-groups]
# grpcio-tools 与 mypy-protobuf 决定提交的生成代码，与 ruff 一样锁定版本；类型存根供 mypy 检查插件运行时
dev = [
  "pytest>=9.0",
  "ruff==0.17.5",
  "mypy>=2.4",
  "grpcio-tools==1.85.1",
  "mypy-protobuf==5.1.0",
  "types-grpcio>=1.85.0.20261028",
  "types-protobuf>=7.35.1.20260906",
]

[tool.hatch.version]
path = "src/xihan_framework/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/xihan_framework"]

[tool.hatch.build.targets.sdist]
# spec/ 与 tests/ 不进 sdist：测试读取 spec/ 下的一致性向量，只在仓库检出里运行；
# 路径以 / 开头锚定在仓库根，否则 README.md、LICENSE 会匹配到 spec/ 里的同名文件
include = ["/src/xihan_framework", "/README.md", "/LICENSE", "/pyproject.toml"]
exclude = ["/spec", "/tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests", "examples", "scripts"]
# 协议代码与类型存根由 scripts/generate_protocol.py 生成，按生成的原样提交，不格式化也不检查
extend-exclude = ["spec", "src/xihan_framework/plugin/v1/plugin_pb2*"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "C4", "SIM", "PIE", "RET", "PT", "ASYNC", "RUF"]
# E501：代码行宽由格式化控制，中文 docstring 与注释不强行折行
# RUF001-003：中文文档与注释里的全角标点是有意的
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
strict = true
python_version = "3.12"
# 生成的 plugin_pb2*.py 有同名的 .pyi，mypy 按存根检查，不看生成的实现
files = ["src", "tests", "examples", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# --durations=10：每次运行都列出最慢的 10 项，CI 的日志里看得到哪些用例在变慢
addopts = ["-ra", "--strict-markers", "--strict-config", "--durations=10"]
xfail_strict = true
filterwarnings = ["error"]
