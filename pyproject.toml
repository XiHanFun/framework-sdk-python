[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "xihan-framework"
dynamic = ["version"]
description = "XiHan Framework SDK for Python: primitives, manifest, invocation context, pipeline and operations."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "XiHanFun" }]
keywords = ["xihan", "framework", "plugin", "pipeline", "operations"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://framework.xihanfun.com"
Documentation = "https://framework.docs.xihanfun.com"
Repository = "https://github.com/XiHanFun/framework-sdk-python"
Specification = "https://github.com/XiHanFun/framework-spec"
Issues = "https://github.com/XiHanFun/framework-sdk-python/issues"

[dependency-groups]
dev = ["pytest>=9.0", "ruff==0.17.5", "mypy>=2.4"]

[tool.hatch.version]
path = "src/xihan_framework/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/xihan_framework"]

[tool.hatch.build.targets.sdist]
# spec/ 与 tests/ 不进 sdist：测试读取 spec/ 下的一致性向量，只在仓库检出里运行
include = ["src/xihan_framework", "README.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["spec"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP", "C4", "SIM", "PIE", "RET", "PT", "ASYNC", "RUF"]
# E501：代码行宽由格式化控制，中文 docstring 与注释不强行折行
# RUF001-003：中文文档与注释里的全角标点是有意的
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = ["error"]
